# Search gold set (site-search spec, "Search quality gate"; design D4). The build
# runs every query through the search core over /api/v1/catalog.json and fails if
# an expected published record is not in the top 5, a forbidden one is, or an
# expect_* assertion fails. For lang zh-Hant queries it also checks that the
# Simplified, 臺/台-swapped and full-width forms return the same top result.
# Expected ids that are not published are skipped, so a takedown never breaks
# the build. These are assertions, not metric baselines: add a query when a
# record is added or a real query fails. Every query names one or two forbidden
# records (review of Milestone A, finding 4), and some queries exist only to
# fail when one normalization step breaks (the "fold:" notes).
#
# Fields: q, mode (datasets|courses), lang (zh-Hant|zh-Hans|en|mixed),
# expected (ids that must be in the top 5), first (id that must rank 1),
# forbidden (ids never in the top 5), expect_zero, expect_nonzero,
# expected_wanted (wanted entries shown in the separate group), note.
queries:
  # Taipei MRT
  - { q: 捷運, mode: datasets, lang: zh-Hant, expected: [taipei-metro-od-monthly], forbidden: [golden-horse-2018-nominations, dgbas-input-output-2021] }
  - { q: 台北捷运, mode: datasets, lang: zh-Hans, expected: [taipei-metro-od-monthly], forbidden: [ly-bill-cosponsorship-10th] }
  - { q: 臺北捷運旅次, mode: datasets, lang: zh-Hant, first: taipei-metro-od-monthly, forbidden: [cpbl-play-by-play] }
  - { q: MRT ridership, mode: datasets, lang: en, expected: [taipei-metro-od-monthly], forbidden: [twnic-interconnection-bandwidth] }
  - { q: 地铁客流网络, mode: datasets, lang: zh-Hans, expected: [taipei-metro-od-monthly], forbidden: [golden-horse-2018-nominations], note: mainland vocabulary }
  - { q: Taipei 捷運 OD, mode: datasets, lang: mixed, expected: [taipei-metro-od-monthly], forbidden: [ly-roll-call-votes] }
  # Legislative Yuan co-sponsorship hypergraph
  - { q: 超圖, mode: datasets, lang: zh-Hant, first: ly-bill-cosponsorship-10th, forbidden: [taipei-metro-od-monthly] }
  - { q: hypergraph, mode: datasets, lang: en, first: ly-bill-cosponsorship-10th, forbidden: [golden-horse-2018-nominations] }
  - { q: 有沒有立委連署的網絡資料, mode: datasets, lang: zh-Hant, first: ly-bill-cosponsorship-10th, forbidden: [taipei-youbike-od], note: natural-language query (spec scenario) }
  - { q: legislator cosponsorship network, mode: datasets, lang: en, expected: [ly-bill-cosponsorship-10th], forbidden: [cpbl-play-by-play] }
  # Golden Horse nominees
  - { q: 金馬獎, mode: datasets, lang: zh-Hant, first: golden-horse-2018-nominations, forbidden: [ly-bill-cosponsorship-10th] }
  - { q: 二分網絡, mode: datasets, lang: zh-Hant, expected: [golden-horse-2018-nominations], forbidden: [taipower-interregional-flow] }
  - { q: bipartite network, mode: datasets, lang: en, expected: [golden-horse-2018-nominations], forbidden: [taipei-metro-od-monthly] }
  - { q: 金馬講 演員, mode: datasets, lang: zh-Hant, expected: [golden-horse-2018-nominations], forbidden: [cpbl-play-by-play], note: typo (講 for 獎) }
  - { q: 電影演員合作關係, mode: datasets, lang: zh-Hant, expected: [golden-horse-2018-nominations], forbidden: [ly-committee-membership], note: paraphrase, a known weak spot }
  # TWNIC
  - { q: 台灣網路節點頻寬, mode: datasets, lang: zh-Hant, first: twnic-interconnection-bandwidth, forbidden: [taipei-metro-od-monthly] }
  - { q: internet topology, mode: datasets, lang: en, first: twnic-interconnection-bandwidth, forbidden: [golden-horse-2018-nominations] }
  - { q: 網際網路拓樸, mode: datasets, lang: zh-Hant, expected: [twnic-interconnection-bandwidth], forbidden: [ly-roll-call-votes] }
  # Other published datasets
  - { q: 產業關聯表, mode: datasets, lang: zh-Hant, first: dgbas-input-output-2021, forbidden: [taipei-metro-od-monthly] }
  - { q: input-output table, mode: datasets, lang: en, expected: [dgbas-input-output-2021], forbidden: [twnic-interconnection-bandwidth] }
  - { q: YouBike 起訖, mode: datasets, lang: mixed, first: taipei-youbike-od, forbidden: [golden-horse-2018-nominations] }
  - { q: 共享單車, mode: datasets, lang: zh-Hant, expected: [taipei-youbike-od], forbidden: [cptond-taiwan-metro], note: synonym only in the alias table }
  - { q: 中職 投打對決, mode: datasets, lang: zh-Hant, expected: [cpbl-play-by-play], forbidden: [ly-roll-call-votes] }
  - { q: baseball, mode: datasets, lang: en, first: cpbl-play-by-play, forbidden: [golden-horse-2018-nominations] }
  - { q: 立委 記名表決, mode: datasets, lang: zh-Hant, expected: [ly-roll-call-votes], forbidden: [cpbl-play-by-play] }
  - { q: signed network, mode: datasets, lang: en, expected: [ly-roll-call-votes], forbidden: [taipei-youbike-od] }
  - { q: 立法院委員會, mode: datasets, lang: zh-Hant, expected: [ly-committee-membership], forbidden: [golden-horse-2018-nominations] }
  - { q: 電力潮流, mode: datasets, lang: zh-Hant, first: taipower-interregional-flow, forbidden: [twnic-interconnection-bandwidth] }
  - { q: 台中捷運 輕軌, mode: datasets, lang: zh-Hant, expected: [cptond-taiwan-metro], forbidden: [dgbas-input-output-2021] }
  # Fold-dependent queries: each fails when its normalization step is removed.
  - { q: 臺電, mode: datasets, lang: zh-Hant, first: taipower-interregional-flow, forbidden: [ly-roll-call-votes], note: "fold: 臺/台 (the record writes 台電)" }
  - { q: 台中, mode: datasets, lang: zh-Hant, expected: [cptond-taiwan-metro], forbidden: [taipei-youbike-od], note: "fold: 臺/台 (the record writes 臺中)" }
  - { q: 網絡科學, mode: courses, lang: zh-Hant, first: nthu-network-science, forbidden: [ntu-graph-theory-with-applications], note: "fold: 網絡≡網路 (the course is titled 網路科學)" }
  # Computer networking: no social, film, legislative or transport data in the top 5
  - q: 計算機網路
    mode: datasets
    lang: zh-Hant
    forbidden: [golden-horse-2018-nominations, ly-bill-cosponsorship-10th, taipei-metro-od-monthly, ly-roll-call-votes, ly-committee-membership, taipei-youbike-od, cptond-taiwan-metro, cpbl-play-by-play, dgbas-input-output-2021, taipower-interregional-flow]
    note: TWNIC is acceptable here; an empty result also passes
  - q: computer network
    mode: datasets
    lang: en
    forbidden: [golden-horse-2018-nominations, ly-bill-cosponsorship-10th, taipei-metro-od-monthly, ly-roll-call-votes, ly-committee-membership, taipei-youbike-od, cptond-taiwan-metro, cpbl-play-by-play, dgbas-input-output-2021, taipower-interregional-flow]
  # Polysemous words do not drag in unrelated records (review finding 3)
  - { q: 社群媒體, mode: datasets, lang: zh-Hant, expect_zero: true, forbidden: [golden-horse-2018-nominations, cpbl-play-by-play] }
  - { q: social media, mode: datasets, lang: en, expect_zero: true, forbidden: [golden-horse-2018-nominations, cpbl-play-by-play] }
  - { q: 新聞媒體, mode: datasets, lang: zh-Hant, expect_zero: true, forbidden: [golden-horse-2018-nominations, cpbl-play-by-play] }
  - { q: news media, mode: datasets, lang: en, expect_zero: true, forbidden: [golden-horse-2018-nominations, cpbl-play-by-play] }
  - { q: 社會運動, mode: datasets, lang: zh-Hant, expect_zero: true, forbidden: [cpbl-play-by-play] }
  - { q: co-authorship, mode: datasets, lang: en, expect_zero: true, forbidden: [ly-bill-cosponsorship-10th], expected_wanted: [citation-network] }
  # Typos only one edit away (review finding 1)
  - { q: citation network, mode: datasets, lang: en, expect_zero: true, forbidden: [taipei-metro-od-monthly, taipei-youbike-od], expected_wanted: [citation-network] }
  - { q: flight routes, mode: datasets, lang: en, expect_zero: true, forbidden: [cptond-taiwan-metro], expected_wanted: [air-routes] }
  # Sensitive data is never hosted: social-media interaction networks return nothing
  - { q: 社群網路 PTT, mode: datasets, lang: mixed, expect_zero: true, forbidden: [golden-horse-2018-nominations], note: PTT/Dcard interaction graphs are level sensitive }
  # Generic-only query lists everything
  - { q: 台灣 網絡 資料, mode: datasets, lang: zh-Hant, expect_nonzero: true }
  # No dataset yet: the wanted entry shows in its own group
  - { q: 人口遷徙, mode: datasets, lang: zh-Hant, expect_zero: true, expected_wanted: [population-migration], forbidden: [taipei-metro-od-monthly] }
  # Courses
  - { q: 社會網絡分析, mode: courses, lang: zh-Hant, expected: [ntnu-geography-social-network-analysis, nccu-social-networks-social-capital], forbidden: [nycu-graph-theory] }
  - { q: social network analysis, mode: courses, lang: en, expected: [ntnu-geography-social-network-analysis, nccu-tigp-intro-social-networks], forbidden: [nycu-fundamental-graph-theory] }
  - { q: 網路科學 課程, mode: courses, lang: zh-Hant, expected: [nthu-network-science, nycu-network-science-social-computing], forbidden: [nycu-graph-theory] }
  - { q: network science, mode: courses, lang: en, first: nthu-network-science, expected: [nycu-network-science-social-computing], forbidden: [ntu-graph-theory-with-applications], note: the historical STAT1021 record may match but ranks below current courses }
  - { q: graph theory, mode: courses, lang: en, first: nycu-graph-theory, expected: [nycu-fundamental-graph-theory, ntu-graph-theory-with-applications], forbidden: [nccu-personal-networks] }
  - { q: 圖論, mode: courses, lang: zh-Hant, expected: [nycu-graph-theory, ntu-graph-theory-with-applications, nycu-fundamental-graph-theory], forbidden: [nccu-social-networks-social-capital] }
  - { q: 圖神經網路, mode: courses, lang: zh-Hant, expected: [ncku-graph-machine-learning, nycu-gnn-recommendation-relation-estimation, nthu-gnn-drug-discovery], forbidden: [nycu-graph-theory] }
  - { q: GNN, mode: courses, lang: en, expected: [ncku-graph-machine-learning], forbidden: [nycu-fundamental-graph-theory] }
  - { q: 生物網路, mode: courses, lang: zh-Hant, expected: [nycu-biological-network-analysis, nycu-network-biology-implementation], forbidden: [nccu-personal-networks] }
  - { q: 资料科学导论, mode: courses, lang: zh-Hans, first: ncku-stat-intro-data-science, forbidden: [nycu-graph-theory] }
  - { q: 資料科學, mode: courses, lang: zh-Hant, first: ncku-stat-intro-data-science, forbidden: [nycu-graph-theory], note: 資料 is a filler word but part of 資料科學 here (review finding 2) }
  - { q: 大數據, mode: courses, lang: zh-Hant, first: nycu-criminal-network-big-data-analytics, forbidden: [ntu-graph-theory-with-applications, nycu-graph-theory], note: 數據 is a filler word but part of 大數據 here (review finding 2) }
  - { q: 計算機網路, mode: courses, lang: zh-Hant, expect_zero: true, forbidden: [nthu-network-science], note: the course catalog excludes computer networking }
  - { q: CS224W, mode: courses, lang: en, expect_zero: true, forbidden: [ncku-graph-machine-learning], note: foreign courses are outside search }
