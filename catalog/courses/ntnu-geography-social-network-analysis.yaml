  zh-Hant: 授課教師的課程網頁所列單元全為社會網絡分析方法，從網絡建構、自我網絡、中心性、社群偵測到 QAP 與 ERGM。
summary:
  zh-Hant: 地理學系的社會網絡分析課，涵蓋網絡資料蒐集與建構、自我網絡與結構洞、中心性、群體與社群偵測、位置與角色、雙模網絡、網絡自相關、QAP 與 ERGM，採講授加實作與專題導向學習。
keywords: [社會網絡分析, 中心性, 社群偵測, QAP, ERGM, NetworkX]
