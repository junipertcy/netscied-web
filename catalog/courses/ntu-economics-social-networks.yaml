  zh-Hant: 經濟所英語授課課程，先介紹網絡的刻畫方式與網絡上的賽局理論，再討論網絡抽樣、社群偵測、網絡外溢效果與網絡形成等實證方法，並以 R 蒐集與分析網絡資料。
