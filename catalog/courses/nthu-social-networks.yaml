inclusion_note:
  zh-Hant: 通訊所公布的課程大綱以社會網絡、圖論與賽局為關鍵詞，講授網絡的表示與測量、策略性網絡形成、網絡上的擴散與網絡賽局，教科書為 Easley 與 Kleinberg《Networks, Crowds, and Markets》。
summary:
  zh-Hant: 跨領域的網絡課程，介紹網絡的表示與測量、策略性網絡形成、網絡上的擴散與學習、網絡上的決策與賽局、網絡化市場，以及在經濟、投票選舉與醫療健康研究上的應用。
keywords: [社會網絡, 網絡賽局, 網絡形成, 擴散, 網絡經濟學]
