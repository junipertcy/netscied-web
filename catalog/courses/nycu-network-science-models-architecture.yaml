inclusion_note:
  zh-Hant: 課程概述明言本課探討網絡科學與複雜網絡，週次計畫涵蓋網絡的數學表示、隨機圖、小世界、無尺度、社群結構、強健性與擴散現象。
summary:
  zh-Hant: 大學部網絡科學課程，從真實網絡的實證研究與圖論基礎出發，介紹 Erdős–Rényi、小世界與 Barabási–Albert 等模型，再談社群偵測、滲流與串聯失效，以及網絡上的流行病擴散。
