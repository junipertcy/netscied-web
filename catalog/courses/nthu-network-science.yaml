inclusion_note:
  zh-Hant: "通訊所公布的課程綱要以網絡的數學表示、測度與中心性、圖分割與社群偵測、隨機圖、網絡形成模型、滲流與網絡上的流行病為內容，教科書為 Newman《Networks: An Introduction》。"
summary:
  zh-Hant: 研究所網絡科學課，以網絡結構與動態分析的理論整合網際網路、電力、社會與生物等不同領域的網絡知識，內容依 Newman 教科書從網絡的數學、測度與演算法到隨機圖、網絡形成模型與網絡上的動態過程。
keywords: [網絡科學, 中心性, 社群偵測, 隨機圖, 偏好依附, 滲流, 流行病模型]
