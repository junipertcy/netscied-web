inclusion_note:
  zh-Hant: 課程簡介說明本課是社會網絡實證與理論研究的導論，並以個人網絡分析的基本概念與原則為核心目標。
summary:
  zh-Hant: 透過研讀經典與當代研究，介紹社會網絡的基本定義、網絡形成與結構（同質性、焦點、社群）、網絡上的傳染與影響、合作網絡、線上網絡，以及網絡抽樣與資料蒐集。
