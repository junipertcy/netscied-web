redistribution:
  basis: license-permits
  note:
    zh-Hant: |-
      LYAPI 的資料集以 CC BY 4.0 釋出。上游的立法院開放資料服務平台
      也以「立法院網站資料開放宣告」與政府資料開放授權條款開放利用。
personal_data:
  level: public-role
  reviewed_on: "2026-11-04"
  notes:
    zh-Hant: |-
      只含立法委員的姓名、英文姓名、黨籍與黨團，以及其職務上的提案、連署行為。上游的議案資料也有一般民眾提出的請願等案件，
      本站只收錄「委員提案」，並只保留名列第10屆立法委員名單的提案人與連署人，其他姓名不會進入託管的檔案。
      LYAPI 委員資料中的學歷、經歷與照片不收錄。
