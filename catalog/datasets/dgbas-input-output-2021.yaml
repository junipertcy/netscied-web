  as_of: "2026-11-04"
  nodes: 163
  edges: 12568
  note:
    zh-Hant: |-
      由 2026-11-04 下載的 XML 檔（3.7 MB）計算：163×163 個部門格中有 12,568 格非零，
      其中 155 格為同部門的自環。
