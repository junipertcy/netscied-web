id: twnic-interconnection-bandwidth
status: published
added: "2026-11-04"
announce: false
title:
  zh-Hant: TWNIC 連線頻寬網絡
  en: TWNIC inter-network bandwidth network
description:
  zh-Hant: |-
    財團法人台灣網路資訊中心（TWNIC）的「連線頻寬登錄查詢系統」，
    提供臺灣各網路之間登錄的連線與頻寬，可依年份與季別下載 GML 格式的網絡檔，
    資料自 2001 年起，每季公布一次。本站不轉載檔案，請至 TWNIC 網站下載。
  en: >-
    TWNIC's registry of interconnection bandwidth between networks in Taiwan,
    downloadable as GML by year and quarter since 2001. This site links to the
    files; it does not host them.
keywords: [TWNIC, 連線頻寬, 網路拓樸, GML, ISP]
semantics:
  node:
    zh-Hant: 登錄於 TWNIC 連線頻寬登錄查詢系統的網路
    en: a network registered in TWNIC's bandwidth registry
  link:
    zh-Hant: 兩個網路之間登錄的連線，標示頻寬（Mbps）
    en: a registered connection between two networks, labelled with its bandwidth (Mbps)
structure:
  kinds: [graph]
  directed: true
  weighted: true
  weight:
    meaning:
      zh-Hant: 連線頻寬（GML 檔中只以標籤文字記載，例如「179 mbps」）
      en: bandwidth, stored only as label text in the GML (for example "179 mbps")
    unit: Mbps
  temporal: { form: snapshots, resolution: quarter }
  spatial: { form: none }
  notes:
    zh-Hant: |-
      2026 年 7 月的檔案宣告為有向圖，509 對節點互有連線，其中 501 對兩個方向的頻寬相同；
      節點顏色分為三類，原始資料未說明其意義。
