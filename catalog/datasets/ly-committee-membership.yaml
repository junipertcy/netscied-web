id: ly-committee-membership
status: published
added: "2026-11-04"
announce: false
title:
  zh-Hant: 立法院委員會成員網絡
  en: Legislative Yuan committee membership
description:
  zh-Hant: |-
    立法院開放資料服務平台的「各委員會-委員名單資料」，
    記錄自第4屆第1會期（1999 年）起，每個會期各委員會的委員名單，並標示召集委員。
    可視為立法委員與委員會之間的二分網絡，依屆別與會期形成時間序列，
    適合觀察委員的專業分工與跨會期的委員會流動。本站只提供連結。
  en: >-
    The Legislative Yuan open data platform's committee membership lists: for
    every session since the first session of the 4th term (1999), which
    legislators sat on which committee, with co-chairs flagged. A legislator–
    committee bipartite network with one snapshot per session. This site links
    to the data; it does not host it.
keywords: [立法院, 委員會, 召集委員, 立法委員, 二分網絡, committee assignments, Legislative Yuan]
semantics:
  node:
    zh-Hant: 立法委員與立法院的委員會（二分）
    en: legislators and Legislative Yuan committees (two node sets)
  link:
    zh-Hant: 某位委員在某屆某會期擔任某委員會的委員；isCoChairman 欄位標示是否為召集委員
    en: a legislator sitting on a committee in a given term and session; the isCoChairman field marks co-chairs
structure:
  kinds: [graph]
  directed: false
  weighted: false
  partitions:
    count: 2
    names:
      - { id: legislators, zh-Hant: 立法委員, en: legislators }
      - { id: committees, zh-Hant: 委員會, en: committees }
  layers: single
  temporal: { form: snapshots, resolution: session }
  spatial: { form: none }
  edge_attributes:
    - name: isCoChairman
      description: { zh-Hant: 是否為召集委員（Y 或 N）, en: whether the member is a co-chair (Y or N) }
  node_attributes:
    - name: lgno
      description: { zh-Hant: 委員編號, en: legislator number }
counts:
  approximate: true
  as_of: "2026-11-04"
  edges: 11834
  note:
    zh-Hant: |-
      取自資料集頁面的「資料筆數」11,834；每筆為一位委員在一個會期的一個委員會席次，
      所以這是所有會期加總的連結數。
coverage:
  temporal:
    start: "1999-02"
    ongoing: true
    note:
      zh-Hant: 自第4屆第1會期起，每日更新。
  spatial: { zh-Hant: 臺灣, en: Taiwan }
domains: [politics]
tags: [legislature, committees]
taiwan_relevance:
