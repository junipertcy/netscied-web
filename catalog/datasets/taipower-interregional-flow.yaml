id: taipower-interregional-flow
status: published
added: "2026-11-04"
announce: false
title:
  zh-Hant: 台電各區域間電力潮流
  en: Taipower inter-regional power flows
description:
  zh-Hant: |-
    台灣電力股份有限公司公布北、中、南、東四個區域之間每 10 分鐘的電力潮流瞬間值（MW），
    資料擷取自電能管理系統（EMS）。四個區域是節點，區域間的潮流是有向連結，
    權重隨時間變化，是一個小而時間解析度高的能源流動網絡。
    目前的檔案涵蓋 2026 年 4 月至 6 月，每月底更新三個月前的資料。本站只提供連結。
  en: >-
    Taiwan Power Company publishes 10-minute instantaneous power flows (MW)
    between its northern, central, southern and eastern regions, taken from its
    energy management system. A small four-node directed network whose link
    weights change every ten minutes. The current file covers April to June
    2026; each month-end update adds the data from three months earlier. Link
    only.
keywords: [台電, 電力潮流, 區域間, 輸電, 電網, 能源, Taipower, power flow, transmission]
semantics:
  node:
    zh-Hant: 台電電力系統的四個區域：北部、中部、南部、東部
    en: one of Taipower's four grid regions (north, central, south, east)
  link:
    zh-Hant: 兩區域之間的電力潮流；檔案中為「中送北」「中送東」「南送中」「南送東」四條，數值為每 10 分鐘的瞬間值
    en: the power flow between two regions; the file has four, named 中送北 (central to north), 中送東 (central to east), 南送中 (south to central) and 南送東 (south to east), as 10-minute instantaneous values
structure:
  kinds: [graph]
  directed: true
  weighted: true
  weight:
    meaning:
      zh-Hant: 電力潮流瞬間值（欄位 P）；資料中有負值，資料集未說明正負號的意義
      en: instantaneous power flow (field P); some values are negative, and the dataset does not explain the sign
    unit: MW
  layers: single
  temporal: { form: snapshots, resolution: 10 minutes }
  spatial: { form: none }
  notes:
    zh-Hant: |-
      JSON 檔的 FLOW_P 陣列每筆含 FUEL_TYPE、UNIT_NAME（例如「中送北潮流」）、DATETIME 與 P。
      資料集備註說明數值擷取自電能管理系統，可能因系統維護、資料設定或傳輸而與實際數值有些許誤差。
coverage:
