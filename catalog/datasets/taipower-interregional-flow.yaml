    start: "2026-04"
    end: "2026-06"
    ongoing: true
    note:
      zh-Hant: 檔案只有一個，涵蓋最近一次更新的三個月；更早的資料不在檔案中。
  spatial: { zh-Hant: 臺灣, en: Taiwan }
counts:
