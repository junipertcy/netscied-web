id: taipei-metro-od-monthly
status: published
added: "2026-11-04"
announce: false
title:
  zh-Hant: 臺北捷運站間起訖運量（月彙總）
  en: Taipei Metro station-to-station origin–destination flows (monthly)
description:
  zh-Hant: |-
    臺北大眾捷運股份有限公司在政府資料開放平臺發布「臺北捷運各站分時進出量統計」，
    每月提供一個檔案，列出各站之間每日每小時的進出站人次，資料自 2017 年 1 月起。
    本站把每個月的資料加總為一張有向加權網絡：節點是車站，
    連結是當月在起站進站、在迄站出站的人次。
    逐時原始檔每月約 300 MB，請至上游下載。
  en: >-
    Taipei Metro publishes, on Taiwan's open government data portal, one file per
    month with hourly entry–exit counts between every pair of stations, since
    January 2017. This site sums each month into a directed weighted network:
    nodes are stations and a link counts the trips that entered at the origin and
    exited at the destination in that month. The hourly source files (about
    300 MB per month) stay upstream.
keywords: [臺北捷運, 台北捷運, 起訖, OD, 進出站, 運量, Taipei Metro, MRT, origin-destination]
semantics:
  node:
    zh-Hant: 臺北捷運車站（依原始資料的進站或出站名稱）
    en: a Taipei Metro station (as named in the entry or exit column of the source)
  link:
    zh-Hant: 當月在起站進站、在迄站出站的人次總和
    en: the number of trips in the month that entered at the origin station and exited at the destination station
structure:
  kinds: [graph]
  directed: true
  weighted: true
  weight:
    meaning:
      zh-Hant: 當月起訖人次（原始資料逐日逐時「人次」欄位的加總）
      en: trips in the month (sum of the source's daily hourly 人次 counts)
    unit: trips
  self_loops: true
  layers: single
  temporal: { form: snapshots, resolution: month }
  spatial: { form: none }
  notes:
    zh-Hant: |-
      原始資料包含同站進出（起迄相同）的人次。
      2026 年 9 月檔案第一個小時有 120 個進站名稱、109 個出站名稱：
      環狀線各站只出現在進站欄，部分轉乘站在出站欄加上路線代碼（例如「G大坪林」「O景安」）。
      本站把出站欄的「G大坪林」「O景安」「O頭前庄」併入「大坪林」「景安」「頭前庄」（兩邊的月人次相近）；
      環狀線其他車站沒有出站紀錄，在網絡中只有出邊。
    en: >-
      The source counts trips that enter and exit at the same station. In the
      September 2026 file, the first hour has 120 entry-station names and 109
      exit-station names: Circular Line stations appear only as entries, and some
      transfer stations carry a line code on the exit side (for example
      "G大坪林", "O景安"). This site merges the exit names G大坪林, O景安 and
      O頭前庄 into 大坪林, 景安 and 頭前庄 (their monthly volumes match); the other
      Circular Line stations have no exit records, so in the network they have
      outgoing edges only.
coverage:
  # The hosted range (version 1.0.0); upstream reaches back to 2017-01 (final review D3).
  temporal:
    start: "2025-10"
    end: "2026-09"
    note:
      zh-Hant: 本站託管的版本 1.0.0 涵蓋 2025 年 10 月至 2026 年 9 月；上游自 2017 年 1 月起每月發布一個檔案，較早的月份可至上游下載。
      en: Version 1.0.0 hosted here covers October 2025 to September 2026; upstream publishes one file per month since January 2017, and earlier months can be downloaded there.
  spatial: { zh-Hant: 臺北都會區, en: Taipei metropolitan area }
domains: [transport]
tags: [metro, public-transport, commuting]
taiwan_relevance:
  basis: [collected-in-taiwan, about-taiwanese-entities, taiwanese-publisher]
  justification: 由臺北大眾捷運股份有限公司發布，記錄臺北都會區捷運各站之間的進出站人次。
provenance:
  source:
    name: { zh-Hant: 臺北捷運各站分時進出量統計, en: Statistics of hourly entries and exits at each Taipei MRT station }
    url: https://data.gov.tw/dataset/128506
    publisher: { zh-Hant: 臺北大眾捷運股份有限公司, en: Taipei Metro }
  method:
    zh-Hant: |-
      上游每月新增一個逐時起訖 CSV（欄位：日期、時段、進站、出站、人次），
      並以一個索引 CSV（欄位：SeqNo、西元年、月、URL、說明/備註）列出各月檔案的網址。
      本站逐月下載後，依（進站，出站）加總全月人次，產生月彙總網絡。
    en: >-
      Upstream adds one hourly OD CSV per month (columns 日期, 時段, 進站, 出站,
      人次) and lists the monthly file URLs in an index CSV (columns SeqNo, 西元年,
      月, URL, 說明/備註). This site downloads each month and sums the counts per
      (entry station, exit station) pair.
  access:
    - label: { zh-Hant: 政府資料開放平臺資料集頁, en: data.gov.tw dataset page }
      url: https://data.gov.tw/dataset/128506
      format: web
    - label: { zh-Hant: 臺北市資料大平臺資料集頁, en: data.taipei dataset page }
      url: https://data.taipei/dataset/detail?id=63f31c7e-7fc3-418b-bd82-b95158755b4d
      format: web
    - label: { zh-Hant: 各月檔案索引（CSV）, en: index of monthly files (CSV) }
      url: https://data.taipei/api/dataset/63f31c7e-7fc3-418b-bd82-b95158755b4d/resource/eb481f58-1238-4cff-8caa-fa7bb20cb4f4/download
      format: csv
    - label: { zh-Hant: 2026 年 9 月逐時起訖檔（約 302 MB）, en: September 2026 hourly OD file (about 302 MB) }
      url: https://tcgmetro.blob.core.windows.net/stationod/%E8%87%BA%E5%8C%97%E6%8D%B7%E9%81%8B%E6%AF%8F%E6%97%A5%E5%88%86%E6%99%82%E5%90%84%E7%AB%99OD%E6%B5%81%E9%87%8F%E7%B5%B1%E8%A8%88%E8%B3%87%E6%96%99_202609.csv
      format: csv
  checked_on: "2026-11-04"
