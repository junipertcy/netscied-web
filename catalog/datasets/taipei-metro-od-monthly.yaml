personal_data:
  level: none
  reviewed_on: "2026-11-04"
  notes:
    zh-Hant: |-
      資料是車站之間的人次統計，不含個別旅客資訊。
      逐時資料有許多 0 或 1 人次的格子，本站只發布月彙總。
