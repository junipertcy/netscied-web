id: ly-roll-call-votes
status: published
added: "2026-11-04"
announce: false
title:
  zh-Hant: 立法院院會記名表決
  en: Legislative Yuan plenary roll-call votes
description:
  zh-Hant: |-
    立法院開放資料服務平台的「院會表決資料」，逐筆記錄院會表決的議題、日期時間、
    表決方式，出席、贊成、反對與棄權人數，以及贊成、反對、棄權三份委員名單。
    可整理成委員與表決之間帶正負號的二分網絡（贊成為正、反對為負），
    用來分析政黨凝聚度與跨黨投票。平台資料自第10屆第7會期（2023 年）起；
    LYAPI 另從公報整理出第8屆起的表決紀錄。本站只提供連結。
  en: >-
    The Legislative Yuan open data platform's plenary vote records: for each
    vote, the issue, date and time, voting method, the numbers present, for,
    against and abstaining, and the three name lists. They form a signed
    legislator–vote bipartite network (for = positive, against = negative). The
    platform's records start in the 7th session of the 10th term (2023); LYAPI
    also parses votes from the gazette back to the 8th term. Link only.
keywords: [立法院, 表決, 記名表決, 贊成, 反對, 棄權, 唱名表決, roll call, roll-call votes, signed network]
semantics:
  node:
    zh-Hant: 立法委員與院會的每一次表決（二分）
    en: legislators and individual plenary votes (two node sets)
  link:
    zh-Hant: 一位委員在一次表決中投贊成、反對或棄權；未列名的委員沒有連結
    en: a legislator voting for, against or abstaining in one vote; legislators not listed have no link
structure:
  kinds: [graph]
  directed: false
  weighted: false
  signed: true
  partitions:
    count: 2
    names:
      - { id: legislators, zh-Hant: 立法委員, en: legislators }
      - { id: votes, zh-Hant: 表決, en: votes }
  layers: single
  temporal: { form: event-times, resolution: minute }
  spatial: { form: none }
  notes:
    zh-Hant: |-
      上游只提供贊成（supporter）、反對（opposer）與棄權（abstainer）三份名單，
      正負號由使用者自行設定。LYAPI 第11屆部分紀錄的表決時間缺少年份（例如「中華民國年3月20日」）。
