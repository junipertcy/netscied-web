id: golden-horse-2018-nominations
status: published
added: 2026-11-04
announce: false
title:
  zh-Hant: 第55屆金馬獎入圍者–電影網絡
  en: 55th Golden Horse Awards nominee–film network (2018)
description:
  zh-Hant: |-
    2018 年第 55 屆金馬獎所有競賽獎項的入圍名單，整理成影片與入圍者之間的二分網絡。
    每一條連結代表某人以某部影片入圍某個獎項，並標示獎項名稱與是否得獎；
    同一人以同一部影片入圍兩個獎項時，會有兩條連結。
    本站依金馬獎官方入圍得獎資料庫自行整理，以 CC BY 4.0 釋出。
  en: >-
    Every nomination in the competitive categories of the 55th Golden Horse
    Awards (2018), as a bipartite network of films and nominees. Each link is
    one nomination of a person for a film in a category, with the category and
    whether it won. Compiled by this site from the official nominee database and
    released under CC BY 4.0.
keywords: [金馬獎, 金馬, 入圍名單, 電影, 影人, Golden Horse Awards]
semantics:
  node:
    zh-Hant: 入圍影片，或以影片入圍的人（導演、演員、編劇、攝影、音樂、剪輯等）
    en: a nominated film, or a person nominated for a film (director, actor, writer, cinematographer, composer, editor and others)
  link:
    zh-Hant: 某人以某部影片入圍某個獎項（一項提名一條連結）
    en: one nomination of a person for a film in one category
structure:
  kinds: [graph]
  directed: false
  weighted: false
  multi_edges: true
  self_loops: false
  partitions:
    count: 2
    names:
      - { id: film, zh-Hant: 影片, en: film }
      - { id: person, zh-Hant: 入圍者, en: nominee }
  layers: single
  temporal: { form: none }
  spatial: { form: none }
  node_attributes:
    - { name: kind, description: { zh-Hant: film 或 person, en: film or person } }
    - { name: label, description: { zh-Hant: 官方名單上的中文片名或姓名, en: title or name as printed on the official list } }
    - { name: label_en, description: { zh-Hant: 官方英文版的片名，或外籍入圍者的原文姓名, en: "official English title, or the original-script name of a non-Chinese nominee" } }
  edge_attributes:
    - { name: category, description: { zh-Hant: 獎項名稱（例如 最佳導演）, en: award category in Mandarin } }
    - { name: category_en, description: { zh-Hant: 獎項英文名稱, en: award category in English } }
    - { name: winner, description: { zh-Hant: 該提名是否得獎, en: whether the nomination won } }
  notes:
    zh-Hant: |-
      影片類獎項（最佳劇情長片、最佳紀錄片、最佳動畫長片、最佳劇情短片、最佳動畫短片）的得獎對象是影片。
      官方名單在紀錄片、動畫與短片獎項列出的個人姓名收為入圍者；最佳劇情長片名單上的出品公司與製片
      （例如《大象席地而坐》的楚延華、胡永振）刻意不列為入圍者，因此這五部影片在該獎項沒有連結。
      公司不列為節點。最佳原創電影歌曲依當屆規章，作詞、作曲與演唱者都是入圍者。
