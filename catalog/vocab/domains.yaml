# The nine controlled domains (dataset-catalog spec, "Controlled bilingual domains").
# Every dataset carries one to three. Crosswalks map each domain to the top-level
# domains of ICON and Netzschleuder and to the old site's six headings, for
# migration and for agents comparing catalogs. Structure never goes here.
