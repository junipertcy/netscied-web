# Search concepts and aliases (design D4; site-search spec, "Query understanding").
# At build time each record gets the labels and aliases of every concept it
# carries, and the search indexes them as an alias field (boost 1.5–2). This
# table is what lets an English or mainland-vocabulary query reach a record
# written only in Traditional Mandarin. Keep aliases granular: an alias that is
# too broad shows up as a forbidden hit in catalog/search-gold.yaml.
#
# attach: how a record gets the concept.
#   kind: <structure kind>          property: <bipartite|multipartite|directed|weighted|signed|temporal|multilayer|spatial>
#   domain: <domain id>             tag: <tag id>
#   category: <course category>     (no attach: only through a record's `concepts:` list)

# Words that say nothing about which record is meant. They never count toward
# the coverage rule; a query of only these words lists everything.
generic: [網路, 網絡, 網絡圖, network, networks, graph, graphs, 圖, 資料, data, 關係, 關聯]

# Removed from queries before matching (natural-language filler; 台灣 says
# nothing in a Taiwan-only catalog). Longest first.
fillers: [有沒有, 我想找, 想要找, 請問, 哪裡有, 哪裡, 哪裏, 相關的, 相關, 有關的, 有關, 關於, 一些, 什麼, 資料集, 資料, 數據集, 數據, 下載, 臺灣, 台灣, 的, 嗎, 呢, dataset, datasets, data, download, taiwanese, taiwan]

# A query containing one of these means computer networking or the internet
# (site-search spec, "Computer-networking ambiguity").
networking_intent: [計算機網路, 電腦網路, 網路工程, 網路協定, 網路通訊, 網路安全, 資訊網路, 通訊網路, tcp/ip, tcp, ip address, computer network, computer networks, computer networking, networking]

# In data mode, course words show a hint toward 課程; in course mode, dataset
# words show a hint toward 資料. Either way they are removed before matching.
mode_words:
  courses: [課程, 開課, 修課, 學分, 授課, syllabus, course, courses, class, classes, lecture]
  datasets: [資料集, 數據集, 資料庫, dataset, datasets, database]

# Phrase folds, applied after the character fold: 網絡 and 網路 mean the same here.
phrase_folds:
  - [網絡, 網路]
  - [社群網路, 社會網路]

