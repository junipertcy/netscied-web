# The site's one redirect map (site-structure spec, "Legacy URLs keep working").
# `pnpm edge:build` embeds it in infra/cloudfront/viewer-request.js, and
# `pnpm test` fails if the two drift apart. Redirects keep the query string.
#
# Phase 0 deployed only the host rule and the slash rules. Task 5.6 enabled the
# legacy rows for the Phase 1 deploy; scripts/build/redirect-pages.mjs also
# writes a fallback page for each enabled row.

canonical_host: netscied.tw
redirect_hosts:
  - www.netscied.tw

# `from`: a path without a trailing slash; it also matches `from/` and `from/index.html`.
# `to`: a site path, or an https URL for an external target.
paths:
  - from: /networks
    to: /datasets/
    enabled: true
  - from: /refs
    to: /courses/
    enabled: true
  - from: /booklet
    to: /about/#booklet
    enabled: true
  - from: /tools
    to: https://github.com/junipertcy/Network-Code-Repository
    enabled: true
