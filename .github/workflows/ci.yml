# Every pull request and every push to main: validate the catalog against main,
# build the site (validate → catalog build → search gold set → ng build →
# sitemap), and run the unit, build, browser and accessibility tests (task 3.6).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Full history: page dates in the sitemap come from git, manifests are
      # checked for immutability against origin/main, and the build refuses a
      # shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Validate the catalog against main (immutable manifests, append-only ids.lock)
        run: node scripts/catalog/validate.mjs --base-ref origin/main --require-base
      - name: Build and test
        run: pnpm test
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Curation pipeline tests
        if: hashFiles('curation/pyproject.toml') != ''
        working-directory: curation
        run: uv run --frozen pytest -q
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
