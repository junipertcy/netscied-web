# Monthly rebuild and deploy (task 3.6; course-catalog spec: course freshness
# labels follow the calendar, so the site is rebuilt at least once a month even
# without content changes). The run also keeps scheduled workflows alive: GitHub
# disables them after 60 days without repository activity.
#
# The deploy job runs only once the owner has configured AWS access for this
# repository: the `production` environment (with a required reviewer), the
# repository variables NETSCIED_DEPLOY_ENABLED=true and NETSCIED_AWS_ROLE_ARN
# (an OIDC role allowed to write the site bucket and invalidate the
# distribution), and the secret NETSCIED_CF_DISTRIBUTION_ID.
name: Monthly rebuild

on:
  schedule:
    - cron: '17 19 1 * *' # 03:17 on the 2nd in Taipei (19:17 UTC on the 1st)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/netscied/browser/
          retention-days: 7

  deploy:
    needs: build
    if: vars.NETSCIED_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist/netscied/browser/
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.NETSCIED_AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: Deploy (assets, then pages, then one invalidation)
        env:
          NETSCIED_CF_DISTRIBUTION_ID: ${{ secrets.NETSCIED_CF_DISTRIBUTION_ID }}
        run: node scripts/deploy.mjs
