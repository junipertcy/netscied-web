schema: spec-driven

context: |
  Site: netscied.tw (台灣網絡科學教育). One maintainer (Tzu-Chi Yen); hosting is personally funded.
  Tech stack: Angular 22 standalone + zoneless, every route prerendered to static HTML at build time
  (@angular/ssr RenderMode.Prerender); pnpm with exact version pins; TypeScript 6.
  Hosting: static files in an S3 bucket behind CloudFront; DNS on Route 53.
  Audience: Taiwanese citizens (Traditional Mandarin, zh-Hant-TW, is primary; English supported) and the AI agents
  they use. Old public URLs must keep working (301 or a meaningful page).
  Keep designs proportionate: no always-on servers or paid services unless a decision in design.md justifies it.

