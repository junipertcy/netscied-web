convert:
  converter: metro_od
  kind: graph
  options:
    # The exit column names three transfer stations with a line code. Each of
    # these names appears only as an exit, its unprefixed form only as an entry,
    # and their monthly volumes match (October 2025: 大坪林 601,421 entries vs
    # G大坪林 570,726 exits; 景安 654,361 vs O景安 607,098; 頭前庄 158,823 vs
    # O頭前庄 147,017; compare 新埔 1,129,190 vs 1,114,326), so they are merged.
    station_aliases:
      G大坪林: 大坪林
      O景安: 景安
      O頭前庄: 頭前庄
operations: [convert, clean, aggregate]
transformations:
  - zh-Hant: 依（月份，進站，出站）加總原始資料逐日逐時的「人次」，每個月份是一張快照；連結的 month 欄為 YYYY-MM，trips 欄為當月人次。
    en: The source's daily hourly 人次 counts are summed per (month, entry station, exit station); each month is one snapshot, with month as YYYY-MM and trips as the month's count.
  - zh-Hant: 當月加總為 0 的起訖配對不列出。
    en: Pairs whose monthly sum is 0 are not listed.
  - zh-Hant: 月份依原始檔：檔案中下個月 1 日凌晨 6 時前的列（例如跨年夜通宵營運）計入該檔的月份；下個月的檔案不重複這些時段。
    en: "Months follow the source files: rows dated the first day of the next month before 06:00 (for example the New Year's Eve all-night service) count for the file's month; the next month's file does not repeat those hours."
  - zh-Hant: 出站欄的「G大坪林」「O景安」「O頭前庄」併入進站欄的「大坪林」「景安」「頭前庄」：前者只出現在出站欄、後者只出現在進站欄，且兩邊的月人次相近。其他站名照原始資料保留。
    en: "The exit names G大坪林, O景安 and O頭前庄 are merged into the entry names 大坪林, 景安 and 頭前庄: each appears on one side only, and their monthly volumes match. Other station names are kept as the source gives them."
  - zh-Hant: 環狀線其他車站（例如十四張、Y板橋）只出現在進站欄：在這些車站出站的旅次不在原始資料中，這些節點只有出邊（節點屬性 appears_as）。
    en: The other Circular Line stations (for example 十四張, Y板橋) appear only as entries; trips exiting there are not in the source, so these nodes have only outgoing edges (node attribute appears_as).
outputs: [csv-bundle, graphml]
