# How version 1.0.0 of taipei-metro-od-monthly is rebuilt (data-curation spec,
# "Reproducible fetch recipes"). Upstream publishes one hourly OD file per month
# (about 300 MB) and an index CSV of their URLs. Version 1.0.0 covers the 12
# months 2025-10 to 2026-09; earlier months can follow as MINOR versions. The
# hourly files exceed the 100 MB per-file ceiling and stay upstream: only their
# URLs, hashes, headers and retrieval dates are kept (provenance.json).
# The index lists http:// URLs; the same paths are fetched over https://.
